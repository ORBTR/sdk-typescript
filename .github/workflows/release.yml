# Builds, tests and packs the tagged version, attaches the package and its checksum to the GitHub release,
# then publishes it to npm as @orbtr/sdk. Publishing runs only when the NPM_TOKEN secret is set (an npm
# automation token with publish rights on the orbtr scope); without it the job warns and publishes nothing.
# The token reaches npm through the environment only.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

env:
  NODE_VERSION: '22'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run check-generated
      - run: npm test
      - name: Check the tag names the package's version
        run: |
          version="$(node -p "require('./package.json').version")"
          [ "${GITHUB_REF_NAME}" = "v${version}" ] || { echo "::error::tag ${GITHUB_REF_NAME} is not v${version}"; exit 1; }
      - name: Pack
        run: |
          npm pack
          sha256sum orbtr-sdk-*.tgz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: |
            orbtr-sdk-*.tgz
            SHA256SUMS
      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" orbtr-sdk-*.tgz SHA256SUMS --clobber

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/download-artifact@v4
        with:
          name: package
      - run: sha256sum -c SHA256SUMS
      - name: Publish to npm
        if: env.HAS_NPM_TOKEN == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish orbtr-sdk-*.tgz --access public
      - name: Name the registry left out
        if: env.HAS_NPM_TOKEN != 'true'
        run: echo "::warning::NPM_TOKEN is not set: npm was not published to"
